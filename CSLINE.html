const loaded=new Array(PAGE_DATA.length).fill(false);
const frames=[...document.querySelectorAll('.tool-frame')];
const buttons=[...document.querySelectorAll('.nav-btn')];
const loading=document.getElementById('loading');
function decodePage(b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes);}
function loadPage(i){if(loaded[i]) return; loading.classList.add('show'); try{frames[i].srcdoc=decodePage(PAGE_DATA[i]);loaded[i]=true;frames[i].addEventListener('load',()=>loading.classList.remove('show'),{once:true});setTimeout(()=>loading.classList.remove('show'),1200);}catch(e){loading.classList.remove('show');console.error(e);}}
function showPage(i){buttons.forEach((b,n)=>b.classList.toggle('active',n===i));frames.forEach((f,n)=>f.classList.toggle('active',n===i));loadPage(i);}
buttons.forEach((b,i)=>b.addEventListener('click',()=>showPage(i)));
loadPage(0);
</script>
