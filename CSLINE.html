:root{--bg:#05070b;--panel:#0b1018;--panel2:#111827;--line:rgba(255,255,255,.085);--fg:#f4f7fb;--muted:#8290a6;--accent:#23d18b;--accent2:#d7ad58;--shadow:0 22px 60px rgba(0,0,0,.38)}
*{box-sizing:border-box} html,body{height:100%;margin:0} body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 15% -10%,rgba(35,209,139,.13),transparent 30%),radial-gradient(circle at 90% 0,rgba(215,173,88,.10),transparent 25%),var(--bg);color:var(--fg);overflow:hidden}
.shell{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);padding:14px;gap:12px}
.topbar{position:relative;z-index:20;display:flex;align-items:center;gap:14px;background:rgba(11,16,24,.88);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:var(--shadow);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.brand{min-width:235px;padding:5px 12px 5px 10px;border-right:1px solid var(--line)}

.brand strong{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase} .brand small{display:block;color:var(--muted);font-size:10px;margin-top:3px;letter-spacing:.04em}
.nav{display:flex;gap:8px;min-width:0;overflow-x:auto;scrollbar-width:none;flex:1} .nav::-webkit-scrollbar{display:none}
.nav-btn{min-width:150px;flex:1;max-width:220px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:14px;padding:9px 10px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:.22s ease;text-align:left;font:inherit}
.nav-btn:hover{background:rgba(255,255,255,.04);color:var(--fg);border-color:var(--line);transform:translateY(-1px)} .nav-btn.active{color:var(--fg);border-color:rgba(35,209,139,.28);background:linear-gradient(135deg,rgba(35,209,139,.13),rgba(215,173,88,.06));box-shadow:inset 0 0 0 1px rgba(35,209,139,.04)}
.nav-icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#151d2a;color:#91a0b8;flex:0 0 auto} .nav-btn.active .nav-icon{background:rgba(35,209,139,.13);color:var(--accent)}
.nav-copy{min-width:0} .nav-copy strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .nav-copy small{display:block;font-size:9px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workspace{position:relative;min-height:0;background:#090d14;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.tool-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#080c12;display:none} .tool-frame.active{display:block}
.loading{position:absolute;inset:0;z-index:5;display:none;place-items:center;background:linear-gradient(145deg,#080d14,#0c121c);color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase} .loading.show{display:grid}
.loader{display:flex;flex-direction:column;align-items:center;gap:12px} .spin{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.08);border-top-color:var(--accent);animation:spin .7s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.shell{padding:8px;gap:8px}.topbar{border-radius:16px;padding:7px;display:block}.brand{min-width:0;border-right:0;border-bottom:1px solid var(--line);padding:5px 8px 9px;margin-bottom:7px}.brand-row{justify-content:center}.brand small{display:none}.nav-btn{min-width:122px;padding:8px}.nav-copy small{display:none}.workspace{border-radius:16px}}

const loaded=new Set();
const frames=[...document.querySelectorAll('.tool-frame')];
const buttons=[...document.querySelectorAll('.nav-btn')];
const loading=document.getElementById('loading');
function decodeBase64Utf8(b64){
  const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}
function loadPage(index){
  const frame=frames[index];
  if(!loaded.has(index)){
    loading.classList.add('show');
    frame.addEventListener('load',()=>loading.classList.remove('show'),{once:true});
    frame.srcdoc=decodeBase64Utf8(PAGE_DATA[index]);
    loaded.add(index);
    setTimeout(()=>loading.classList.remove('show'),2500);
  }
}
function activate(index,updateHash=true){
  index=Math.max(0,Math.min(frames.length-1,Number(index)||0));
  buttons.forEach((b,i)=>b.classList.toggle('active',i===index));
  frames.forEach((f,i)=>f.classList.toggle('active',i===index));
  loadPage(index);
  if(updateHash) history.replaceState(null,'','#menu-'+(index+1));
  try{localStorage.setItem('multiToolLastMenu',String(index))}catch(e){}
}
buttons.forEach((btn,i)=>btn.addEventListener('click',()=>activate(i)));
let start=0;
const hashMatch=location.hash.match(/^#menu-(\d+)$/);
if(hashMatch) start=Number(hashMatch[1])-1; else {try{start=Number(localStorage.getItem('multiToolLastMenu')||0)}catch(e){}}
activate(start,false);
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#menu-(\d+)$/);if(m)activate(Number(m[1])-1,false)});
</script>
</body>
