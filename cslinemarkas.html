);transform:scaleX(0);transition:.22s ease}.nav-btn:hover{background:#f6f9fc;color:#263b56;border-color:#e0e9f1;transform:translateY(-1px)}.nav-btn.active{color:#1b2c43;border-color:color-mix(in srgb,var(--a) 22%,#dbe6ef);background:linear-gradient(135deg,color-mix(in srgb,var(--a) 10%,white),color-mix(in srgb,var(--b) 7%,white));box-shadow:0 7px 20px rgba(63,91,122,.08),inset 0 1px 0 #fff}.nav-btn.active:after{transform:scaleX(1)}.nav-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#eef4f8;color:#7a8ea4;flex:0 0 auto;border:1px solid #e0e9f0}.nav-btn.active .nav-icon{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent;box-shadow:0 7px 16px color-mix(in srgb,var(--a) 20%,transparent)}.nav-copy{min-width:0}.nav-copy strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav-copy small{display:block;font-size:9px;color:#8a9aac;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workspace{position:relative;min-height:0;background:#f4f8fb;border:1px solid #d7e4ed;border-radius:24px;overflow:hidden;box-shadow:0 22px 60px rgba(55,81,107,.13),inset 0 1px 0 #fff}.tool-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f3f7fb;display:none}.tool-frame.active{display:block}.tool-frame.syair-frame{background:#0a0608}.loading{position:absolute;inset:0;z-index:5;display:none;place-items:center;background:linear-gradient(145deg,#eef5fa,#fbfdff);color:#74879d;font-size:11px;letter-spacing:.10em;text-transform:uppercase}.loading.show{display:grid}.loader{display:flex;flex-direction:column;align-items:center;gap:13px}.spin{width:31px;height:31px;border-radius:50%;border:3px solid #dce7f0;border-top-color:#4c7dff;border-right-color:#20a792;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.shell{padding:8px;gap:8px}.topbar{border-radius:18px;padding:7px;display:block}. /* ===== NAV MENU: YELLOW + GRAY THEME ===== */
:root{
  --menu-purple:#8b6ff0;
  --menu-purple-2:#b39cff;
  --menu-purple-deep:#6a4bd1;
  --menu-gray:#666a72;
  --menu-gray-2:#959aa3;
  --menu-silver:#f1f2f6;
  --menu-line:#d7d8df;
}
.topbar{
  background:rgba(255,255,255,.94);
  border-color:#d9dcdf;
  box-shadow:0 18px 55px rgba(56,60,65,.12),inset 0 1px 0 rgba(255,255,255,.95);
}
.brand{border-right-color:#dedfe1}
.logo-image-wrap{
  width:64px;
  height:52px;
  border-radius:13px;
  padding:5px 7px;
  background:linear-gradient(145deg,#fff,#f1f2f3);
  border:1px solid #d9dbde;
  box-shadow:0 8px 20px rgba(70,72,74,.10),inset 0 1px 0 #fff;
  overflow:hidden;
}
.brand-logo-img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.12));
}
.brand strong{color:#34373b}
.brand small{color:#85898e}
.nav{gap:8px}
.nav-btn,
.nav-btn:nth-child(2),
.nav-btn:nth-child(3),
.nav-btn:nth-child(4),
.nav-btn:nth-child(5),
.nav-btn:nth-child(6),
.nav-btn:nth-child(7),
.nav-btn:nth-child(8),
.nav-btn:nth-child(9),
.nav-btn:nth-child(10){
  --a:var(--menu-purple);
  --b:#7d8088;
}
.nav-btn{
  background:linear-gradient(145deg,#f7f8f9,#eef0f2);
  border:1px solid #dde0e3;
  color:#676c72;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95);
}
.nav-btn:after{
  height:3px;
  background:linear-gradient(90deg,#7b7f88 0%,#8b6ff0 45%,#b39cff 100%);
}
.nav-btn:hover{
  color:#40374f;
  border-color:#c5b7ef;
  background:linear-gradient(135deg,#faf8ff,#f0eef7);
  box-shadow:0 8px 20px rgba(96,83,140,.12),inset 0 1px 0 #fff;
}
.nav-btn.active{
  color:#303236;
  border-color:#a88af2;
  background:linear-gradient(135deg,#f5efff 0%,#e3d8ff 52%,#eceef1 100%);
  box-shadow:0 9px 24px rgba(108,85,177,.16),inset 0 1px 0 rgba(255,255,255,.9);
}
.nav-icon{
  background:linear-gradient(145deg,#f7f8f9,#e5e7e9);
  color:#73777c;
  border-color:#d7dade;
}
.nav-btn:hover .nav-icon{
  color:#6d55b9;
  border-color:#c3b5ef;
  background:#f3eeff;
}
.nav-btn.active .nav-icon{
  color:#ffffff;
  background:linear-gradient(135deg,#9c82ff,#7456df);
  border-color:#684bcc;
  box-shadow:0 7px 17px rgba(111,82,202,.26),inset 0 1px 0 rgba(255,255,255,.28);
}
.nav-copy small{color:#92969b}
.nav-btn.active .nav-copy small{color:#686b6f}
.spin{border-top-color:#8b6ff0;border-right-color:#7a7f89}
@media(max-width:900px){
  .logo-image-wrap{width:58px;height:48px}
}

/* Logo-only brand area */
.brand.brand-logo-only{
  min-width:180px;
  padding:4px 14px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.brand.brand-logo-only .brand-row{
  width:100%;
  justify-content:center;
  gap:0;
}
.brand.brand-logo-only .logo-image-wrap{
  width:142px;
  height:58px;
  padding:4px 8px;
  border-radius:14px;
}
@media(max-width:900px){
  .brand.brand-logo-only{min-width:132px;padding:4px 8px}
  .brand.brand-logo-only .logo-image-wrap{width:116px;height:52px}
}



/* ===== PREMIUM SIDEBAR LAYOUT ===== */
@media (min-width: 901px){
  body{
    background:
      radial-gradient(circle at 0% 0%,rgba(139,111,240,.14),transparent 24%),
      radial-gradient(circle at 100% 100%,rgba(122,127,136,.12),transparent 28%),
      linear-gradient(145deg,#eef1f4 0%,#fafbfc 48%,#eceff2 100%);
  }
  .shell{
    grid-template-columns:282px minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
    gap:14px;
    padding:14px;
  }
  .topbar{
    height:100%;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:0;
    padding:12px;
    border-radius:28px;
    overflow:hidden;
    background:
      linear-gradient(180deg,rgba(255,255,255,.98),rgba(243,244,245,.96));
    border:1px solid #d7d9dc;
    box-shadow:0 24px 65px rgba(47,51,56,.14),inset 0 1px 0 #fff;
  }
  .topbar::before{
    content:"";
    position:absolute;
    inset:0 auto 0 0;
    width:4px;
    background:linear-gradient(180deg,#b39cff 0%,#8b6ff0 45%,#7b7f88 100%);
    opacity:.95;
  }
  .brand.brand-logo-only{
    min-width:0;
    width:100%;
    padding:14px 10px 16px;
    border-right:0;
    border-bottom:1px solid #dcdee1;
    position:relative;
  }
  .brand.brand-logo-only::after{
    content:"";
    position:absolute;
    left:32px; right:32px; bottom:-1px;
    height:2px;
    background:linear-gradient(90deg,transparent,#8b6ff0,transparent);
  }
  .brand.brand-logo-only .brand-row{justify-content:center}
  .brand.brand-logo-only .logo-image-wrap{
    width:196px;
    height:80px;
    border:none;
    padding:5px 8px;
    border-radius:18px;
    background:linear-gradient(145deg,#fff,#f2f3f4);
    box-shadow:0 12px 28px rgba(57,60,64,.10),inset 0 1px 0 #fff;
  }
  .nav{
    counter-reset:menu;
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    gap:7px;
    overflow-y:auto;
    overflow-x:hidden;
    padding:12px 3px 10px 6px;
    scrollbar-width:thin;
    scrollbar-color:#8b6ff0 transparent;
  }
  .nav::-webkit-scrollbar{display:block;width:5px}
  .nav::-webkit-scrollbar-track{background:transparent}
  .nav::-webkit-scrollbar-thumb{background:#9a81f1;border-radius:99px}
  .nav-section-label{
    display:flex;
    align-items:center;
    gap:9px;
    margin:10px 7px 3px;
    color:#8f8b99;
    font-size:9px;
    font-weight:800;
    letter-spacing:.16em;
    text-transform:uppercase;
  }
  .nav-section-label:first-child{margin-top:2px}
  .nav-section-label::before{
    content:"";
    width:7px;height:7px;border-radius:2px;
    background:linear-gradient(135deg,#a88af2,#7c60e0);
    box-shadow:0 0 0 3px rgba(139,111,240,.12);
  }
  .nav-section-label::after{
    content:"";
    height:1px;
    flex:1;
    background:linear-gradient(90deg,#d9dbde,transparent);
  }
  .nav-btn,
  .nav-btn:nth-child(n){
    counter-increment:menu;
    width:100%;
    min-width:0;
    max-width:none;
    flex:0 0 auto;
    min-height:61px;
    border-radius:17px;
    padding:9px 38px 9px 9px;
    background:linear-gradient(145deg,#f5f5f8,#ececf1);
    border:1px solid #dde0e3;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 5px 12px rgba(74,68,96,.045);
  }
  .nav-btn::before{
    content:counter(menu, decimal-leading-zero);
    position:absolute;
    right:11px;
    top:10px;
    font-size:9px;
    line-height:1;
    font-weight:800;
    letter-spacing:.08em;
    color:#ada7bc;
    transition:.22s ease;
  }
  .nav-btn:after{
    left:auto;
    right:0;
    top:11px;
    bottom:11px;
    width:4px;
    height:auto;
    border-radius:4px 0 0 4px;
    background:linear-gradient(180deg,#b79fff,#8b6ff0 60%,#7d8088);
    transform:scaleY(0);
    transform-origin:center;
  }
  .nav-btn:hover{
    transform:translateX(3px);
    background:linear-gradient(135deg,#fbfaff,#f0eff5 78%);
    border-color:#bca9f2;
    box-shadow:0 10px 24px rgba(93,80,144,.12),inset 0 1px 0 #fff;
  }
  .nav-btn:hover::before{color:#7155c2}
  .nav-btn.active{
    transform:translateX(4px);
    color:#312a42;
    background:linear-gradient(135deg,#f6f0ff 0%,#e2d6ff 48%,#ececf1 100%);
    border-color:#9f84ef;
    box-shadow:0 12px 28px rgba(105,83,177,.17),inset 0 1px 0 rgba(255,255,255,.95);
  }
  .nav-btn.active::after{transform:scaleY(1)}
  .nav-btn.active::before{color:#6447c7}
  .nav-icon{
    width:40px;
    height:40px;
    border-radius:13px;
    background:linear-gradient(145deg,#f8f7fc,#e7e6ed);
    border-color:#d7dade;
    box-shadow:inset 0 1px 0 #fff;
  }
  .nav-btn.active .nav-icon{
    color:#ffffff;
    background:linear-gradient(135deg,#9d83ff,#7658e0);
    border-color:#6b4ecf;
    box-shadow:0 9px 18px rgba(110,83,199,.24),inset 0 1px 0 rgba(255,255,255,.3);
  }
  .nav-copy strong{
    font-size:11.5px;
    letter-spacing:.01em;
    color:#57515f;
  }
  .nav-copy small{
    font-size:8.5px;
    color:#948ea0;
    margin-top:4px;
  }
  .nav-btn.active .nav-copy strong{color:#2f2941}
  .nav-btn.active .nav-copy small{color:#6e6880}
  .workspace{
    border-radius:30px;
    border:1px solid #d7dadd;
    background:linear-gradient(145deg,#f5f6f7,#eceff1);
    box-shadow:0 28px 75px rgba(47,51,56,.14),inset 0 1px 0 #fff;
  }
  .workspace::before{
    content:"";
    position:absolute;
    z-index:4;
    top:0;left:26px;right:26px;
    height:3px;
    border-radius:0 0 8px 8px;
    background:linear-gradient(90deg,transparent,#7c8090 18%,#8b6ff0 50%,#7c8090 82%,transparent);
    pointer-events:none;
  }
  .tool-frame{background:#f2f4f5}
  .loading{
    background:linear-gradient(145deg,#f1f3f4,#fbfbfc);
    color:#787c81;
    letter-spacing:.14em;
  }
  .loader{
    padding:22px 28px;
    border-radius:20px;
    background:rgba(255,255,255,.92);
    border:1px solid #dedfe1;
    box-shadow:0 16px 38px rgba(47,51,56,.12);
  }
  .spin{
    width:36px;height:36px;
    border-color:#e0e2e4;
    border-top-color:#8b6ff0;
    border-right-color:#7d8088;
  }
}

@media (max-width: 900px){
  .nav-section-label{display:none}
  .nav-btn::before{display:none}
  .topbar::before{display:none}
  .brand.brand-logo-only .logo-image-wrap{width:146px;height:60px}
  .nav-btn{min-width:132px}
}

/* ===== COLLAPSIBLE SIDEBAR / FULL VIEW ===== */
.sidebar-toggle{display:none}
@media (min-width:901px){
  .shell{
    --sidebar-width:282px;
    transition:grid-template-columns .34s cubic-bezier(.2,.8,.2,1),gap .34s ease;
  }
  .topbar{
    transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .24s ease;
  }
  .workspace{
    transition:border-radius .34s ease,box-shadow .34s ease;
  }
  .sidebar-toggle{
    position:fixed;
    z-index:120;
    top:50%;
    left:calc(14px + var(--sidebar-width) - 18px);
    transform:translateY(-50%);
    width:38px;
    height:66px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(170,146,255,.44);
    border-radius:14px;
    cursor:pointer;
    color:#f2eeff;
    background:linear-gradient(180deg,#514565 0%,#35323c 52%,#2b2d33 100%);
    box-shadow:0 12px 30px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.025) inset;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

function loadPage(i){
  if(loaded[i]) return;
  loading.classList.add('show');
  try{
    let html=decodePage(PAGE_DATA[i]);
    if(i===8){
      // Jadwal Pasaran: gunakan srcdoc agar konteks halaman sama seperti host,
      // lalu tambahkan fallback JSONP khusus Google Sheets untuk menghindari error CORS/blob.
      const patch=decodePage(JADWAL_FETCH_PATCH_B64);
      html=html.replace('</head>',patch+'</head>');
      frames[i].srcdoc=html;
    }else if(i>=5){
      // ALL MEMO dan menu tambahan lain tetap memakai dokumen Blob normal.
      const blob=new Blob([html],{type:'text/html;charset=utf-8'});
      pageBlobUrls[i]=URL.createObjectURL(blob);
      frames[i].src=pageBlobUrls[i];
    }else{
      frames[i].srcdoc=html;
    }
    loaded[i]=true;
    frames[i].addEventListener('load',()=>loading.classList.remove('show'),{once:true});
    setTimeout(()=>loading.classList.remove('show'),1600);
  }catch(e){
    loading.classList.remove('show');
    console.error(e);
  }
}
function showPage(i){buttons.forEach((b,n)=>b.classList.toggle('active',n===i));frames.forEach((f,n)=>f.classList.toggle('active',n===i));loadPage(i);}

const shell=document.querySelector('.shell');
const sidebarToggle=document.getElementById('sidebarToggle');
const workspace=document.querySelector('.workspace');
let sidebarAnimating=false;

function syncSidebarUi(collapsed,persist=true){
  if(!shell||!sidebarToggle)return;
  const icon=sidebarToggle.querySelector('i');
  if(icon){
    icon.classList.toggle('fa-angles-left',!collapsed);
    icon.classList.toggle('fa-angles-right',collapsed);
  }
  sidebarToggle.setAttribute('aria-expanded',String(!collapsed));
  sidebarToggle.setAttribute('aria-label',collapsed?'Buka menu':'Tutup menu');
  sidebarToggle.title=collapsed?'Buka menu kembali':'Tutup menu untuk tampilan penuh';
  if(persist){
    try{localStorage.setItem('citawinSidebarCollapsed',collapsed?'1':'0')}catch(_){ }
  }
}

function applySidebarState(collapsed,persist=true,animate=true){
  if(!shell||!sidebarToggle)return;
  if(!animate||!workspace||window.innerWidth<=900||window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    shell.classList.toggle('sidebar-collapsed',collapsed);
    syncSidebarUi(collapsed,persist);
    return;
  }
  if(sidebarAnimating)return;
  sidebarAnimating=true;

  const first=workspace.getBoundingClientRect();
  shell.classList.toggle('sidebar-collapsed',collapsed);
  syncSidebarUi(collapsed,persist);
  const last=workspace.getBoundingClientRect();

  const dx=first.left-last.left;
  const sx=last.width?first.width/last.width:1;
  workspace.classList.add('sidebar-motion');

  /* Web Animations API keeps the transition on the compositor and avoids
     continuously resizing the iframe during the motion. */
  const motion=workspace.animate([
    {transform:`translate3d(${dx}px,0,0) scaleX(${sx})`},
    {transform:'translate3d(0,0,0) scaleX(1)'}
  ],{
    duration:360,
    easing:'cubic-bezier(.16,1,.3,1)',
    fill:'both'
  });

  const finish=()=>{
    workspace.classList.remove('sidebar-motion');
    sidebarAnimating=false;
  };
  motion.addEventListener('finish',finish,{once:true});
  motion.addEventListener('cancel',finish,{once:true});
}

if(sidebarToggle){
  let initialCollapsed=false;
  try{initialCollapsed=localStorage.getItem('citawinSidebarCollapsed')==='1'}catch(_){ }
  applySidebarState(initialCollapsed,false,false);
  sidebarToggle.addEventListener('click',()=>applySidebarState(!shell.classList.contains('sidebar-collapsed'),true,true));
}
