/* ===== EFEK LATAR BOLA JATUH ===== */
#cw-widget-root {
position: relative !important;
isolation: isolate !important;
overflow: hidden !important;
padding: 22px 14px 28px !important;
border-radius: 28px !important;
background:
radial-gradient(circle at 50% -10%, rgba(255,215,106,.16), transparent 34%),
radial-gradient(circle at 0% 35%, rgba(25,118,210,.10), transparent 28%),
radial-gradient(circle at 100% 70%, rgba(46,204,113,.08), transparent 30%),
linear-gradient(180deg, #08090d 0%, #101116 45%, #08090c 100%) !important;
box-shadow: inset 0 0 80px rgba(255,215,106,.035), 0 24px 80px rgba(0,0,0,.45) !important;
}
#cw-widget-root::before {
content: "";
position: absolute;
inset: 0;
z-index: -2;
pointer-events: none;
opacity: .18;
background-image:
linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
background-size: 34px 34px;
mask-image: linear-gradient(to bottom, rgba(0,0,0,.8), transparent 88%);
}
#cw-widget-root::after {
content: "";
position: absolute;
left: 8%; right: 8%; bottom: -95px;
height: 180px;
z-index: -1;
pointer-events: none;
border: 2px solid rgba(255,255,255,.06);
border-radius: 50%;
background: radial-gradient(ellipse at center, rgba(45,185,95,.13), transparent 66%);
box-shadow: 0 0 55px rgba(45,185,95,.08);
}
#cw-widget-root > *:not(.cw-ball-rain) { position: relative; z-index: 2; }

.cw-ball-rain {
position: absolute;
inset: 0;
overflow: hidden;
pointer-events: none;
z-index: 1;
}
.cw-falling-ball {
--size: 26px;
--left: 50%;
--duration: 10s;
--delay: 0s;
--drift: 30px;
position: absolute;
top: -90px;
left: var(--left);
width: var(--size);
height: var(--size);
display: grid;
place-items: center;
font-size: var(--size);
line-height: 1;
opacity: 0;
filter: drop-shadow(0 8px 8px rgba(0,0,0,.45)) drop-shadow(0 0 8px rgba(255,255,255,.12));
animation: cw-ball-fall var(--duration) linear var(--delay) infinite;
will-change: transform, opacity;
}
.cw-falling-ball::after {
content: "";
position: absolute;
width: 70%; height: 18%;
left: 15%; bottom: -14px;
border-radius: 50%;
background: rgba(255,215,106,.20);
filter: blur(8px);
}
@keyframes cw-ball-fall {
0%   { transform: translate3d(0,-80px,0) rotate(0deg) scale(.7); opacity: 0; }
7%   { opacity: .68; }
48%  { transform: translate3d(var(--drift),48vh,0) rotate(390deg) scale(1); }
92%  { opacity: .52; }
100% { transform: translate3d(calc(var(--drift) * -0.45),115vh,0) rotate(760deg) scale(.82); opacity: 0; }
}

.cw-hero::before,
.cw-card::before {
content: "";
position: absolute;
inset: 0;
pointer-events: none;
background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.055) 48%, transparent 76%);
transform: translateX(-120%);
animation: cw-shine 8s ease-in-out infinite;
}
.cw-card { position: relative !important; }
@keyframes cw-shine {
0%, 58% { transform: translateX(-125%); }
76%, 100% { transform: translateX(125%); }
}
.cw-dot { animation: cw-live-pulse 1.8s ease-in-out infinite !important; }
@keyframes cw-live-pulse {
0%,100% { transform: scale(1); box-shadow: 0 0 8px currentColor; }
50% { transform: scale(1.35); box-shadow: 0 0 18px currentColor; }
}
.cw-logo-top { animation: cw-logo-float 4s ease-in-out infinite !important; }
@keyframes cw-logo-float {
0%,100% { transform: translateY(0); }
50% { transform: translateY(-6px); }
}

@media (prefers-reduced-motion: reduce) {
.cw-falling-ball, .cw-hero::before, .cw-card::before, .cw-dot, .cw-logo-top { animation: none !important; }
.cw-falling-ball { display: none !important; }
}
@media (max-width: 600px) {
#cw-widget-root { padding: 14px 8px 22px !important; border-radius: 20px !important; }
.cw-falling-ball:nth-child(n+10) { display: none; }
}


/* ===== BACKGROUND STADION PREMIUM + GARIS TABEL NEON ===== */
html {
min-height: 100%;
background: #030508;
}
body {
min-height: 100vh;
position: relative;
overflow-x: hidden;
background:
linear-gradient(180deg, rgba(2,5,10,.72) 0%, rgba(3,7,11,.90) 52%, rgba(1,3,6,.97) 100%),
radial-gradient(circle at 18% 4%, rgba(255,236,158,.23), transparent 22%),
radial-gradient(circle at 82% 5%, rgba(255,236,158,.20), transparent 22%),
url("https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=1920&q=82") center center / cover fixed no-repeat;
}
body::before {
content: "";
position: fixed;
inset: 0;
pointer-events: none;
z-index: 0;
background:
linear-gradient(90deg, rgba(0,0,0,.34), transparent 20%, transparent 80%, rgba(0,0,0,.34)),
radial-gradient(ellipse at 50% 108%, rgba(26,150,72,.19), transparent 48%),
repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 72px);
}
body::after {
content: "";
position: fixed;
inset: 8px;
z-index: 999999;

/* Kilat tipis melintas setiap 5 detik, hanya memakai transform GPU */
.cw-card {
overflow: hidden !important;
}

.cw-card::before {
display: block !important;
content: "" !important;
position: absolute !important;
inset: 0 auto 0 -32% !important;
width: 24% !important;
height: 100% !important;
pointer-events: none !important;
z-index: 3 !important;
opacity: 0 !important;
background: linear-gradient(105deg,
transparent 0%,
rgba(255,255,255,.02) 28%,
rgba(255,240,170,.24) 50%,
rgba(255,255,255,.02) 72%,
transparent 100%) !important;
transform: translate3d(0,0,0) skewX(-14deg) !important;
animation: cw-lightning-pass 5s linear infinite !important;
will-change: transform, opacity !important;
}

@keyframes cw-lightning-pass {
0%, 76% {
transform: translate3d(0,0,0) skewX(-14deg);
opacity: 0;
}
78% { opacity: .8; }
94% {
transform: translate3d(650%,0,0) skewX(-14deg);
opacity: .34;
}
100% {
transform: translate3d(650%,0,0) skewX(-14deg);
opacity: 0;
}
}

<script>
(function() {

function cwCreateBallRain() {
const rain = document.getElementById("cw-ball-rain");
if (!rain || rain.dataset.ready === "1") return;
rain.dataset.ready = "1";
const total = window.innerWidth <= 600 ? 2 : 4;
const frag = document.createDocumentFragment();
for (let i = 0; i < total; i++) {
const ball = document.createElement("span");
ball.className = "cw-falling-ball";
ball.textContent = "⚽";
const size = 18 + Math.random() * 24;
ball.style.setProperty("--size", `${size.toFixed(0)}px`);
ball.style.setProperty("--left", `${(Math.random() * 96).toFixed(1)}%`);
ball.style.setProperty("--duration", `${(13 + Math.random() * 8).toFixed(1)}s`);
ball.style.setProperty("--delay", `${(-Math.random() * 16).toFixed(1)}s`);
ball.style.setProperty("--drift", `${(-55 + Math.random() * 110).toFixed(0)}px`);
frag.appendChild(ball);
}
rain.appendChild(frag);
}

document.addEventListener("visibilitychange", function () {
const root = document.getElementById("cw-widget-root");
if (root) root.classList.toggle("cw-paused", document.hidden);
}, { passive: true });

const ESPN_API = "https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard";
const TZ = "Asia/Jakarta";
const MAX_GOALS = 6;

const cwState = {
date: "", query: "", leagueFilter: "all", matches: [], loading: false, error: "", openId: null
};

function cwGetDate(offset = 0) {
const d = new Date(); d.setDate(d.getDate() + offset);
return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d).replaceAll("-", "");
}

function cwFormatLongDate(offset = 0) {
const d = new Date(); d.setDate(d.getDate() + offset);
return new Intl.DateTimeFormat("id-ID", { timeZone: TZ, day: "numeric", month: "long", year: "numeric" }).format(d);
}

function cwUpdateDateLine() {
const el = document.getElementById("cw-date-line");
if (el) el.textContent = `📅 ${cwFormatLongDate(0)} - ${cwFormatLongDate(1)}`;
}

function cwEscape(val) {
return String(val ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
}

async function cwFetchData(dateKey) {
const apiUrl = `${ESPN_API}?region=us&lang=en&contentorigin=espn&isqualified=true&limit=1000&dates=${dateKey}`;
const candidates = [
{ url: apiUrl, unwrap: r => r.json() },
{ url: `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`, unwrap: r => r.json() },
{ url: `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`, unwrap: r => r.json() }
];
for (const c of candidates) {
try {
const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 12000);
const res = await fetch(c.url, { signal: ctrl.signal }); clearTimeout(t);
if (!res.ok) continue;
const data = await c.unwrap(res);
if (data && Array.isArray(data.events)) return data;
} catch (e) {}
}
throw new Error("Gagal memuat ESPN API.");
}

function cwResolveLeagueName(event, competition, leagues) {
const leagueName = event?.league?.name || event?.league?.displayName || competition?.league?.name || competition?.league?.displayName || "";
const typeName = competition?.type?.text || "";
if (leagueName && typeName && leagueName !== typeName) return `${leagueName} - ${typeName}`;
if (leagueName) return leagueName;
if (typeName) return typeName.toUpperCase();
const uid = String(event?.uid || competition?.uid || "");
const matchingLeague = leagues.find(l => { const lUid = String(l?.uid || ""); return lUid && uid.startsWith(lUid); });
if (matchingLeague?.name) return matchingLeague.name;
const slug = event?.season?.slug || competition?.type?.text || "";
return slug ? String(slug).replaceAll("-", " ").toUpperCase() : "SOCCER FIXTURES";
}

function cwParseData(payload, dateKey, dayLabel) {
const leagues = Array.isArray(payload.leagues) ? payload.leagues : [];
const events = payload.events || []; const matches = []; const seen = new Set();
for (const ev of events) {
const comp = ev.competitions?.[0] || {}; const comps = comp.competitors || [];
if (comps.length < 2) continue;
const hRaw = comps.find(i => i.homeAway === "home") || comps[0];
const aRaw = comps.find(i => i.homeAway === "away") || comps[1];
const hTeam = hRaw?.team || {}; const aTeam = aRaw?.team || {};
const home = { name: hTeam.displayName || "Home", logo: hTeam.logo || hTeam.logos?.[0]?.href || "" };
const away = { name: aTeam.displayName || "Away", logo: aTeam.logo || aTeam.logos?.[0]?.href || "" };
// Jangan masukkan pertandingan jika salah satu tim tidak mempunyai logo.
if (!home.logo || !away.logo) continue;
const league = cwResolveLeagueName(ev, comp, leagues);
const kickoff = comp.date || ev.date || "";
const time = new Intl.DateTimeFormat("id-ID", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(kickoff)).replace(".", ":");
const status = comp?.status?.type?.shortDetail || "Scheduled";
const id = ev.id || `${league}|${home.name}|${away.name}`;
if (seen.has(id)) continue; seen.add(id);
matches.push({ id, league, time, kickoff, dateKey, dayLabel, status, home, away, predHome: 0, predAway: 0, details: null });
}
return matches.sort((a, b) => new Date(a.kickoff) - new Date(b.kickoff));
}

function cwHash(text) {
let h = 2166136261;
for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
return h >>> 0;
}

function cwGenerateScore(m, dateStr) {
const rng = (s => () => { s += 0x6D2B79F5; let t = Math.imul(s ^ (s >>> 15), s | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; })(cwHash(`${m.id}|${m.home.name}|${m.away.name}|${dateStr}`));
const poisson = (l) => { let p = 1, c = 0; do { c++; p *= rng(); } while (p > Math.exp(-l) && c < 20); return Math.max(0, c - 1); };
let hg = Math.min(MAX_GOALS, poisson(1.1 + (cwHash(m.home.name) % 1000) / 2500));
let ag = Math.min(MAX_GOALS, poisson(0.9 + (cwHash(m.away.name) % 1000) / 2500));
if (hg === 0 && ag === 0 && rng() > 0.6) { rng() > 0.5 ? hg = 1 : ag = 1; }
return [hg, ag];
}

function cwGenerateDetails(m) {
const hSc = m.predHome;
const aSc = m.predAway;
const diff = hSc - aSc;
const absDiff = Math.abs(diff);
let homeProb, drawProb, awayProb;

if (absDiff === 0) { // Seri
homeProb = 34; drawProb = 33; awayProb = 33;
} else if (absDiff === 1) { // Jarak 1 gol
if (diff > 0) { homeProb = 47; drawProb = 29; awayProb = 24; }
else { awayProb = 47; drawProb = 29; homeProb = 24; }
} else if (absDiff === 2) { // Jarak 2 gol
if (diff > 0) { homeProb = 63; drawProb = 22; awayProb = 15; }
else { awayProb = 63; drawProb = 22; homeProb = 15; }
} else if (absDiff === 3) { // Jarak 3 gol
if (diff > 0) { homeProb = 76; drawProb = 15; awayProb = 9; }
else { awayProb = 76; drawProb = 15; homeProb = 9; }
} else { // Jarak 4 gol atau lebih
if (diff > 0) { homeProb = 85; drawProb = 10; awayProb = 5; }
else { awayProb = 85; drawProb = 10; homeProb = 5; }
}

let hdp = "0.0";
if (diff >= 2) hdp = "-1.5";
else if (diff === 1) hdp = "-0.5";
else if (diff === -1) hdp = "+0.5";
else if (diff <= -2) hdp = "+1.5";

const total = hSc + aSc;
let ouLine = "2.0 / 2.5";
if (total >= 4) ouLine = "3.0 / 3.5";
else if (total === 3) ouLine = "2.5 / 3.0";
else if (total <= 1) ouLine = "1.5 / 2.0";

return { homeProb, drawProb, awayProb, hdp, ouLine, exactScore: `${hSc} - ${aSc}` };
}

function cwSetStatus(type, msg) {
const wrap = document.getElementById("cw-status-wrap");
const txt = document.getElementById("cw-status-text");
const dot = wrap.querySelector('.cw-dot');
dot.style.background = type === 'err' ? '#ff5c5c' : type === 'ok' ? '#34d399' : '#ffd76a';
txt.textContent = msg;
}

function cwPopulateLeagues() {
const select = document.getElementById("cw-league-select");
if (!select) return;
const leagues = [...new Set(cwState.matches.map(m => m.league))].sort();
const currentVal = cwState.leagueFilter || "all";
select.innerHTML = '<option value="all">Semua Liga</option>';
leagues.forEach(l => { const opt = document.createElement("option"); opt.value = l; opt.textContent = l; select.appendChild(opt); });
if (leagues.includes(currentVal)) { select.value = currentVal; } else { select.value = "all"; cwState.leagueFilter = "all"; }
}

function cwGetFiltered() {
let filtered = cwState.matches;
if (cwState.leagueFilter && cwState.leagueFilter !== "all") {
filtered = filtered.filter(m => m.league === cwState.leagueFilter);
}
if (cwState.query) {
const q = cwState.query.toLowerCase();
filtered = filtered.filter(m => { const haystack = `${m.league} ${m.home.name} ${m.away.name}`.toLowerCase(); return haystack.includes(q); });
}
return filtered;
}

function cwRenderTodaySlider() {
const track = document.getElementById("cw-today-track");
if (!track) return;

if (cwState.loading) {
track.innerHTML = '<div class="cw-today-empty">⏳ Memuat pertandingan hari ini dan besok...</div>';
return;
}
if (!cwState.matches.length) {
track.innerHTML = '<div class="cw-today-empty">Belum ada pertandingan berlogo untuk hari ini dan besok.</div>';
return;
}

const logoHTML = (team) => {
const name = cwEscape(team?.name || "TEAM");
return `<img class="cw-today-logo" src="${cwEscape(team.logo)}" alt="${name}" loading="lazy"
onerror="this.closest('.cw-today-item')?.remove();">`;
};

const makeItems = () => cwState.matches.map(m => {
const detail = cwGenerateDetails(m);
const hdp = cwEscape(detail.hdp || "0.0");
const parts = String(m.dateKey || "").match(/^(\d{4})(\d{2})(\d{2})$/);
const dateLabel = parts ? `${parts[3]}/${parts[2]}/${parts[1]}` : cwEscape(m.dateKey || "");

return `
<div class="cw-today-item">
<div class="cw-today-badge">${cwEscape(m.dayLabel)} · MATCH DAY</div>
<div class="cw-today-league">${cwEscape(m.league)}</div>

<div class="cw-today-teams">
<div class="cw-today-team-box">
<div class="cw-today-logo-wrap">${logoHTML(m.home)}</div>
<span class="cw-today-team">${cwEscape(m.home.name)}</span>
</div>

<div class="cw-today-vs">VS</div>

<div class="cw-today-team-box">
<div class="cw-today-logo-wrap">${logoHTML(m.away)}</div>
<span class="cw-today-team">${cwEscape(m.away.name)}</span>
</div>
</div>

<div class="cw-today-datetime">${dateLabel} • ${cwEscape(m.time)} WIB</div>

<div class="cw-today-bottom">
<div class="cw-today-stat">
<small>PASARAN HDP</small>
<strong>${hdp}</strong>
</div>
<div class="cw-today-stat">
<small>PREDIKSI</small>
<strong>${m.predHome} : ${m.predAway}</strong>
</div>
</div>
</div>`;
}).join("");

const oneSet = makeItems();
track.innerHTML = oneSet + oneSet;
track.style.setProperty("--cw-slide-speed", Math.max(38, cwState.matches.length * 5.5) + "s");
}

function cwRender() {
cwRenderTodaySlider();
const c = document.getElementById("cw-content-wrap"); const counter = document.getElementById("cw-counter");
if (!c || !counter) return;
if (cwState.loading) { c.innerHTML = `<div class="cw-empty">⏳ Memuat jadwal...</div>`; counter.textContent = "0 pertandingan"; return; }
if (cwState.error) { c.innerHTML = `<div class="cw-empty">❌ ${cwEscape(cwState.error)}</div>`; counter.textContent = "0 pertandingan"; return; }

const visibleMatches = cwGetFiltered();
counter.textContent = `${visibleMatches.length} pertandingan`;

if (!visibleMatches.length) { c.innerHTML = `<div class="cw-empty">Tidak ada pertandingan yang cocok.</div>`; return; }

const groups = new Map();
visibleMatches.forEach(m => { if (!groups.has(m.league)) groups.set(m.league, []); groups.get(m.league).push(m); });

c.innerHTML = [...groups.entries()].map(([league, matches]) => `
<div class="cw-league">
<div class="cw-league-title"><span>${cwEscape(league)}</span><small>${matches.length} laga</small></div>
${matches.map(m => {
const logoH = m.home.logo ? `<img src="${cwEscape(m.home.logo)}" referrerpolicy="no-referrer" loading="lazy" decoding="async" onerror="this.style.display='none'">` : `<span style="width:32px;display:inline-block;text-align:center">⚽</span>`;
const logoA = m.away.logo ? `<img src="${cwEscape(m.away.logo)}" referrerpolicy="no-referrer" loading="lazy" decoding="async" onerror="this.style.display='none'">` : `<span style="width:32px;display:inline-block;text-align:center">⚽</span>`;
const isOpen = cwState.openId === m.id;
const detailHtml = isOpen ? cwBuildInlineDetail(m) : "";
return `
<div class="cw-match-wrap${isOpen ? " open" : ""}" data-wrap-id="${cwEscape(m.id)}">
<div class="cw-match" data-id="${cwEscape(m.id)}" role="button" aria-expanded="${isOpen}" tabindex="0">
<div class="cw-meta">
<span class="cw-pill">${cwEscape(m.dayLabel)} · ${cwEscape(m.dateKey.slice(6,8))}/${cwEscape(m.dateKey.slice(4,6))}</span>
<span class="cw-pill">🕒 ${cwEscape(m.time)} WIB</span>
<span class="cw-pill">${cwEscape(m.status)}</span>
</div>
<div class="cw-team home">${logoH}<span class="cw-name">${cwEscape(m.home.name)}</span></div>
<div class="cw-prediction"><small>SKOR</small><div class="cw-score">${m.predHome} - ${m.predAway}</div></div>
<div class="cw-team away"><span class="cw-name">${cwEscape(m.away.name)}</span>${logoA}</div>
</div>
<div class="cw-inline-detail" aria-hidden="${!isOpen}">
<div class="cw-inline-detail-inner">${detailHtml}</div>
</div>
</div>
`;
}).join("")}
</div>
`).join("");

c.querySelectorAll('.cw-match').forEach(el => {
const toggle = () => cwToggleInline(el.getAttribute('data-id'));
el.addEventListener('click', toggle);
el.addEventListener('keydown', (e) => {
if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
});
});
}

function cwBuildInlineDetail(m) {
if (!m.details) m.details = cwGenerateDetails(m);
const d = m.details;
const logoH = m.home.logo ? `<img src="${cwEscape(m.home.logo)}" referrerpolicy="no-referrer" loading="lazy">` : `<span>⚽</span>`;
const logoA = m.away.logo ? `<img src="${cwEscape(m.away.logo)}" referrerpolicy="no-referrer" loading="lazy">` : `<span>⚽</span>`;
return `
<div class="cw-inline-detail-content">
<div class="cw-inline-header">
<div class="cw-inline-team">${logoH}<span>${cwEscape(m.home.name)}</span></div>
<div class="cw-inline-vs">VS</div>
<div class="cw-inline-team away"><span>${cwEscape(m.away.name)}</span>${logoA}</div>
</div>
<div class="cw-inline-section-title">1X2 · Peluang Menang</div>
<div class="cw-bar-container">
<div class="cw-bar home" style="width:${d.homeProb}%">${d.homeProb}%</div>
<div class="cw-bar draw" style="width:${d.drawProb}%">${d.drawProb}%</div>
<div class="cw-bar away" style="width:${d.awayProb}%">${d.awayProb}%</div>
</div>
<div class="cw-inline-grid">
<div class="cw-inline-stat"><small>HANDICAP</small><strong>${cwEscape(d.hdp)}</strong></div>
<div class="cw-inline-stat"><small>OVER / UNDER</small><strong>${cwEscape(d.ouLine)}</strong></div>
<div class="cw-inline-stat score"><small>SKOR AKURAT</small><strong>${cwEscape(d.exactScore)}</strong></div>
</div>
</div>`;
}

function cwToggleInline(id) {
cwState.openId = cwState.openId === id ? null : id;
cwRender();
if (cwState.openId) {
requestAnimationFrame(() => {
const target = document.querySelector(`[data-wrap-id="${CSS.escape(id)}"]`);
if (target) target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});
}
}

async function cwLoad() {
cwState.date = cwGetDate(0); cwUpdateDateLine(); cwState.error = ""; cwState.matches = []; cwState.loading = true;
cwSetStatus("load", "Mengambil jadwal hari ini dan besok..."); cwRender();
try {
const todayKey = cwGetDate(0);
const tomorrowKey = cwGetDate(1);
const [todayData, tomorrowData] = await Promise.all([
cwFetchData(todayKey),
cwFetchData(tomorrowKey)
]);
cwState.matches = [
...cwParseData(todayData, todayKey, "HARI INI"),
...cwParseData(tomorrowData, tomorrowKey, "BESOK")
].sort((a, b) => new Date(a.kickoff) - new Date(b.kickoff));
cwState.matches.forEach(m => {
const [hg, ag] = cwGenerateScore(m, m.dateKey);
m.predHome = hg; m.predAway = ag;
});
cwPopulateLeagues();
cwSetStatus("ok", `${cwState.matches.length} pertandingan berlogo untuk hari ini dan besok dimuat.`);
} catch (e) {
cwState.error = e.message || "Error"; cwSetStatus("err", cwState.error);
} finally {
cwState.loading = false; cwRender();
}
}

let cwLastDate = "";
function cwCheckDay() { const t = cwGetDate(0); if (t !== cwLastDate) { cwLastDate = t; cwLoad(); } }

function cwInit() {
cwCreateBallRain();
const searchInput = document.getElementById("cw-search");
if (searchInput) searchInput.addEventListener("input", (e) => { cwState.query = e.target.value.trim().toLowerCase(); cwRender(); });
const leagueSelect = document.getElementById("cw-league-select");
if (leagueSelect) leagueSelect.addEventListener("change", (e) => { cwState.leagueFilter = e.target.value; cwRender(); });

cwLastDate = cwGetDate(0); cwLoad(); setInterval(cwCheckDay, 60000);
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", cwInit);
else cwInit();
})();
</script>
