
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CITAWIN Telegram Power</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(27, 90, 255, .20), transparent 32%),
      radial-gradient(circle at 80% 85%, rgba(0, 210, 170, .16), transparent 28%),
      #080b12;
    color: #fff;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .panel {
    width: min(92vw, 430px);
    padding: 36px 28px 30px;
    border-radius: 28px;
    background: rgba(18, 24, 36, .78);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 24px 70px rgba(0,0,0,.45);
    backdrop-filter: blur(14px);
    text-align: center;
  }
  .brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2.6px;
    color: #aeb8c9;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 25px;
    margin: 0 0 8px;
    letter-spacing: .3px;
  }
  .subtitle {
    margin: 0 0 34px;
    color: #7f8ba0;
    font-size: 14px;
  }
  .power-wrap {
    position: relative;
    width: 190px;
    height: 190px;
    margin: 0 auto 28px;
    display: grid;
    place-items: center;
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: inset 0 0 36px rgba(255,255,255,.025);
  }
  button#power {
    width: 142px;
    height: 142px;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    background: linear-gradient(145deg, #121827, #090d15);
    color: #738197;
    box-shadow:
      0 16px 40px rgba(0,0,0,.48),
      inset 0 1px 0 rgba(255,255,255,.06);
    transition: .25s ease;
    display: grid;
    place-items: center;
  }
  button#power:hover { transform: scale(1.025); }
  button#power:active { transform: scale(.98); }
  button#power svg {
    width: 58px;
    height: 58px;
    filter: drop-shadow(0 0 0 transparent);
    transition: .25s ease;
  }
  body.on button#power {
    color: #4fffb0;
    box-shadow:
      0 0 22px rgba(79,255,176,.24),
      0 0 70px rgba(79,255,176,.13),
      inset 0 1px 0 rgba(255,255,255,.08);
  }
  body.on .ring {
    border-color: rgba(79,255,176,.28);
    box-shadow:
      0 0 55px rgba(79,255,176,.12),
      inset 0 0 36px rgba(79,255,176,.04);
  }
  body.on button#power svg {
    filter: drop-shadow(0 0 14px rgba(79,255,176,.55));
  }
  .status {
    font-weight: 800;
    letter-spacing: 1.5px;
    font-size: 18px;
    margin-bottom: 8px;
  }
  .status.off { color: #ff6c7b; }
  .status.on  { color: #4fffb0; }
  .detail {
    color: #7f8ba0;
    font-size: 13px;
    min-height: 20px;
  }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 7px;
    background: #ff6c7b;
    box-shadow: 0 0 12px rgba(255,108,123,.55);
  }
  body.on .dot {
    background: #4fffb0;
    box-shadow: 0 0 12px rgba(79,255,176,.65);
  }
  .hint {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,.06);
    color: #5f6a7d;
    font-size: 12px;
  }
  .busy { pointer-events: none; opacity: .65; }
</style>
</head>
<body>
  <main class="panel">
    <div class="brand">CITAWIN</div>
    <h1>Telegram Auto Power</h1>
    <p class="subtitle">Kontrol telegram_auto.py dari satu tombol.</p>

    <div class="power-wrap">
      <div class="ring"></div>
      <button id="power" aria-label="Power">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linecap="round">
          <path d="M12 2v10"/>
          <path d="M6.32 5.32a8 8 0 1 0 11.36 0"/>
        </svg>
      </button>
    </div>

    <div id="status" class="status off"><span class="dot"></span>OFF</div>
    <div id="detail" class="detail">Mengecek status...</div>

    <div class="hint">Klik tombol power untuk mengaktifkan / menonaktifkan Telegram Auto.</div>
  </main>

<script>
const btn = document.getElementById('power');
const statusEl = document.getElementById('status');
const detailEl = document.getElementById('detail');

let running = false;
let busy = false;

function render(on, detail='') {
  running = !!on;
  document.body.classList.toggle('on', running);
  statusEl.className = 'status ' + (running ? 'on' : 'off');
  statusEl.innerHTML = `<span class="dot"></span>${running ? 'ON' : 'OFF'}`;
  detailEl.textContent = detail || (running
    ? 'Telegram Auto sedang berjalan di background.'
    : 'Telegram Auto sedang berhenti.');
}

async function getStatus() {
  try {
    const r = await fetch('/api/status', {cache:'no-store'});
    const d = await r.json();
    render(d.running, d.message || '');
  } catch (e) {
    render(false, 'Panel kontrol tidak terhubung ke server lokal.');
  }
}

btn.addEventListener('click', async () => {
  if (busy) return;
  busy = true;
  btn.classList.add('busy');
  detailEl.textContent = running ? 'Menonaktifkan...' : 'Mengaktifkan...';

  try {
    const endpoint = running ? '/api/stop' : '/api/start';
    const r = await fetch(endpoint, {method:'POST'});
    const d = await r.json();
    render(d.running, d.message || '');
  } catch (e) {
    detailEl.textContent = 'Gagal menghubungi server lokal.';
  } finally {
    busy = false;
    btn.classList.remove('busy');
  }
});

getStatus();
setInterval(getStatus, 2500);
</script>
</body>
</html>
